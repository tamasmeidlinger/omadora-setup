[ids]
*

[main]
capslock = overload(control, esc)
space = overload(shift, space)

leftalt = leftmeta
leftmeta = leftalt
rightalt = leftcontrol

leftshift = layer(ls)

[ls]
m = f5
n = f6
o = f7
p = f8
h = f9
j = f10
k = f11
l = f12

[control]
q = M-q
1 = M-1
2 = M-2
3 = M-3
4 = M-4
5 = M-5
c = C-insert
v = S-insert


[meta]
w = C-w
t = C-t
l = C-l
d = C-space


[control+shift]
l = C-backspace
1 = M-S-1
2 = M-S-2
3 = M-S-3
4 = M-S-4
5 = M-S-5
c = C-c
